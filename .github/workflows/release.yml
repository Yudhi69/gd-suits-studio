# Builds and publishes a release every time something lands on main.
#
# The app checks this repository's releases for updates, so a merge that never
# becomes a release is a change GD cannot get. Cutting one by hand meant there
# were none at all for the first eighteen pull requests.
#
# Each release is <major>.<minor>.<run number> taken from package.json, which
# gives a number that always goes up without anything committing back to main
# and triggering itself. The version is written into package.json inside the
# job, before building, so the app reports the same version the release is
# tagged with - the updater compares those two and would offer an endless
# update if they disagreed.
#
# Put [skip release] in a merge commit message for a change that does not
# deserve 290MB of installers.

name: Release

on:
  push:
    branches: [main]
  # So the build can be proved on a branch before it is merged. A workflow
  # cannot be tested any other way, and the first run of this one failed on
  # both platforms - which is a poor thing to discover on main.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (off by default - a dry run just builds)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner images are pinned, not "-latest".
          #
          # The first run failed on both platforms for the same reason: npm
          # ships node-gyp 9.4.1 with Node 20, and both images had moved past
          # what it understands. Windows had Visual Studio 18, which it cannot
          # recognise ("could not find a version of Visual Studio 2017 or
          # newer"); macOS had Python 3.14, which its bundled gyp cannot run.
          # Neither has anything to do with this code, and both would come
          # back on a random morning when GitHub rolls the images forward.
          #
          # windows-2022 carries Visual Studio 2022, which node-gyp 9 knows.
          #
          # Pinning does not settle macOS on its own - macos-14 ships the same
          # Python 3.14 as the latest image - so the Python is chosen below as
          # well. Checked rather than assumed: I pinned the image first,
          # thinking that was the fix, and reading what the image actually
          # contains is what stopped a second broken merge.
          #
          # These will be retired eventually and the sign will be exactly this
          # failure again; the fix then is a newer Node here, which brings a
          # newer node-gyp with it.
          - os: macos-14
            name: macOS
            # Each architecture is built in its own pass on purpose: in one
            # pass electron-builder runs them in parallel and they collide in
            # a shared temp directory, and you silently get only one DMG.
            build: npm run build && npx electron-builder --mac --arm64 --publish never && npx electron-builder --mac --x64 --publish never
            artifacts: release/*.dmg
          - os: windows-2022
            name: Windows
            build: npm run build && npx electron-builder --win --x64 --publish never
            artifacts: release/*Setup*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Python 3.11, and not a digit higher.
      #
      # better-sqlite3 ships no prebuilt binary for this target, so it is
      # compiled here, by node-gyp 9.4.1 - the version @electron/rebuild pins,
      # so electron-builder uses it too and there is no escaping it.
      #
      # That node-gyp bundles a gyp that does `from distutils.version import
      # StrictVersion`, and distutils was removed from the standard library in
      # Python 3.12. It accepts any Python >=3.6.0, so a newer one is taken
      # happily and then dies inside with `configure error`, which names
      # neither Python nor distutils.
      #
      # Reproduced locally before being changed again: 3.12 fails exactly as
      # the runner did, and an interpreter that still has distutils configures
      # cleanly. 3.11 is the last release that has it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile native modules with that Python
        shell: bash
        run: echo "npm_config_python=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Stamp the version being released
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      # --publish never on every call above, not just here: on CI
      # electron-builder decides by itself to publish, then stops the build
      # because there is no GH_TOKEN. The release is cut by the job below,
      # from artifacts, which is the only place that should be doing it.
      - run: ${{ matrix.build }}
        env:
          # Ad-hoc signing only. There is no Developer ID yet, and without
          # this electron-builder looks for one and fails the build rather
          # than falling back.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          retention-days: 3

  publish:
    needs: [version, build]
    # A dry run builds both platforms and stops, leaving the installers as
    # artifacts to download and check without cutting a release.
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Build the page that ships beside the installers
        run: node scripts/make-install-note.js "installers/Read me first.html"
      - name: Notes, from the commit that caused this
        run: |
          {
            echo "What landed:"
            echo
            git log -1 --pretty=%B
            echo
            echo "---"
            echo
            echo "**Intel MacBook** - the .dmg without \`arm64\` in its name."
            echo "**Apple-chip MacBook** - the \`-arm64.dmg\`."
            echo "**Windows** - the \`.exe\`."
            echo
            echo "Both systems warn on first launch because the app is not signed with a paid"
            echo "certificate. On a Mac, hold Control and click the icon, then choose Open."
            echo "On Windows, click More info then Run anyway. See \`Read me first.html\`."
            echo
            echo "Your orders, clients, photographs and measurements are never touched by an update."
          } > notes.md
      # Whether this is really the newest version, rather than merely the
      # newest release.
      #
      # Run numbers only ever go up, but the runs do not finish in that order:
      # 0.1.10 published at 13:37 and 0.1.9 at 13:42, so GitHub marked 0.1.9
      # as Latest because it was created last. The app asks for
      # /releases/latest, so a copy on 0.1.10 would have been offered 0.1.9 -
      # a downgrade it would go on being offered forever.
      #
      # So the comparison is against the highest tag that exists, by version
      # and not by date, and this release claims Latest only if it wins.
      - name: Is this actually the newest version?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new='${{ needs.version.outputs.version }}'
          highest=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
                      | sed 's/^v//' | sort -V | tail -1)
          echo "highest published: ${highest:-none}, this one: $new"
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$new" | sort -V | tail -1)" = "$new" ]; then
            echo 'make=true' >> "$GITHUB_OUTPUT"
          else
            echo 'make=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: GD Suits Studio ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: installers/*
          fail_on_unmatched_files: true
          make_latest: ${{ steps.newest.outputs.make }}
